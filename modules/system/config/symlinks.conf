# Bash configuration, sourced inside system_symlinks_run().
# Install beside the System module: modules/system/config/symlinks.conf
# Paths in TARGET_DIRS are relative to storage_slow().

declare -A TARGET_DIRS=(
    [music]="Music"
    [pictures]="Pictures"
    [videos]="Videos"
)

# Link names must be single filenames; targets must be absolute paths.
# Split at the FIRST colon, so targets may themselves contain colons.
declare -a EXTRA_SYMLINKS=(
    # "Downloads:$(storage_slow)/Downloads"
)

# Add another associative array LINK_NAMES_<language> to extend languages.
# English is required and is the per-key fallback.
declare -A LINK_NAMES_en=(
    [music]="Music"
    [pictures]="Pictures"
    [videos]="Videos"
)

declare -A LINK_NAMES_ru=(
    [music]="Музыка"
    [pictures]="Изображения"
    [videos]="Видео"
)

declare -A LINK_NAMES_ja=(
    [music]="音楽"
    [pictures]="画像"
    [videos]="動画"
)

declare -A LINK_NAMES_kk=(
    [music]="Музыка"
    [pictures]="Білгіш"
    [videos]="Бейнелер"
)
